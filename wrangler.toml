# Cloudflare Workers（静的アセット配信）の設定
#
# このサイトはビルド不要の静的サイトなので、
# 「どのフォルダを公開するか」を指定しているだけです。
#
# 手元から直接デプロイしたい場合は、プロジェクト直下でこの1行:
#
#     npx wrangler deploy
#
# 公開されないファイル（node_modules、原本画像など）は
# .assetsignore で除外しています。

name = "chenmetaikisitu"
compatibility_date = "2026-09-17"

[assets]
directory = "."
